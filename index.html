<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>公務人員行政中立實務測驗 (10題單選)</title>
  <style>
    :root {
      --primary: #1e40af;
      --primary-hover: #1d4ed8;
      --success: #059669;
      --danger: #dc2626;
      --bg: #f8fafc;
      --surface: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --radius: 12px;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.08), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: linear-gradient(135deg, #1e3a8a 0%, #1e40af 100%);
      color: #ffffff;
      padding: 2rem 1.5rem;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    }

    header h1 {
      font-size: 1.85rem;
      font-weight: 800;
      margin-bottom: 0.35rem;
    }

    header p {
      font-size: 1rem;
      color: #bfdbfe;
    }

    main {
      flex: 1;
      max-width: 820px;
      width: 100%;
      margin: 2rem auto;
      padding: 0 1.25rem;
    }

    .card {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      padding: 2rem;
      margin-bottom: 1.5rem;
    }

    /* Step 1: Start Screen */
    #start-screen {
      text-align: center;
      padding: 3rem 2rem;
    }

    .form-group {
      max-width: 380px;
      margin: 1.75rem auto;
      text-align: left;
    }

    label {
      display: block;
      font-weight: 700;
      font-size: 1.05rem;
      margin-bottom: 0.6rem;
      color: #1e293b;
    }

    input[type="text"] {
      width: 100%;
      padding: 0.85rem 1rem;
      font-size: 1.1rem;
      border: 2px solid var(--border);
      border-radius: 8px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="text"]:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(30, 64, 175, 0.15);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.85rem 2rem;
      font-size: 1.1rem;
      font-weight: 700;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-secondary {
      background: #e2e8f0;
      color: #334155;
    }

    .btn-secondary:hover {
      background: #cbd5e1;
    }

    /* Top User Bar */
    .user-info-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 8px;
      padding: 0.85rem 1.25rem;
      margin-bottom: 1.5rem;
      font-weight: 600;
      color: #1e3a8a;
    }

    /* Question Cards */
    .question-card {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      padding: 1.75rem;
      margin-bottom: 1.5rem;
    }

    .q-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
    }

    .q-badge {
      display: inline-block;
      padding: 0.25rem 0.65rem;
      background: #e0e7ff;
      color: var(--primary);
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 700;
    }

    .q-status {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .q-text {
      font-size: 1.12rem;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 1.25rem;
      line-height: 1.5;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
    }

    .option-item {
      display: flex;
      align-items: flex-start;
      gap: 0.85rem;
      padding: 0.85rem 1rem;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      background: #ffffff;
    }

    .option-item:hover {
      background: #f8fafc;
      border-color: #94a3b8;
    }

    .option-item input[type="radio"] {
      margin-top: 0.25rem;
      width: 1.15rem;
      height: 1.15rem;
      accent-color: var(--primary);
      cursor: pointer;
    }

    .option-item span {
      font-size: 1rem;
      color: #334155;
    }

    /* Results */
    .result-status {
      margin-top: 1rem;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-weight: 700;
      display: none;
    }

    .result-correct {
      background: #ecfdf5;
      border: 1px solid #a7f3d0;
      color: var(--success);
      display: block;
    }

    .result-incorrect {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: var(--danger);
      display: block;
    }

    /* Score Banner */
    .score-card {
      background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
      color: #ffffff;
      padding: 2.5rem;
      border-radius: var(--radius);
      text-align: center;
      margin-bottom: 2rem;
      box-shadow: 0 10px 15px -3px rgba(30, 64, 175, 0.25);
    }

    .score-card h2 {
      font-size: 2.25rem;
      margin-bottom: 0.5rem;
    }

    .score-card p {
      font-size: 1.15rem;
      color: #dbeafe;
    }

    .quiz-actions {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-top: 2rem;
      padding-bottom: 3rem;
    }

    footer {
      text-align: center;
      padding: 1.5rem;
      color: var(--text-muted);
      font-size: 0.9rem;
      border-top: 1px solid var(--border);
      background: #ffffff;
    }

    @media (max-width: 640px) {
      header h1 { font-size: 1.5rem; }
      .card { padding: 1.5rem 1rem; }
      .question-card { padding: 1.25rem 1rem; }
      .user-info-bar { flex-direction: column; gap: 0.5rem; align-items: flex-start; }
      .quiz-actions { flex-direction: column; }
      .btn { width: 100%; }
    }
  </style>
</head>
<body>

  <header>
    <h1>公務人員行政中立實務測驗</h1>
    <p>依據 1070828 行政中立宣導資料 ‧ 全份共 10 題選擇題</p>
  </header>

  <main>

    <!-- STEP 1: Name Input Screen -->
    <div id="start-screen" class="card">
      <h2 style="font-size: 1.5rem; color: #1e293b; margin-bottom: 0.5rem;">歡迎參加實務測驗</h2>
      <p style="color: var(--text-muted);">測試開始前，請先輸入您的姓名以利記錄測驗成績：</p>
      
      <div class="form-group">
        <label for="user-name">受測者姓名：</label>
        <input type="text" id="user-name" placeholder="請輸入您的姓名" autocomplete="off" autofocus>
        <div id="name-error" style="color: var(--danger); font-size: 0.9rem; margin-top: 0.5rem; display: none;">
          ⚠️ 請輸入姓名後再開始測驗！
        </div>
      </div>

      <button class="btn btn-primary" onclick="startQuiz()">進入測驗 ➔</button>
    </div>

    <!-- STEP 2: Quiz Form (Hidden initially) -->
    <div id="quiz-screen" style="display: none;">
      
      <div class="user-info-bar">
        <span>👤 受測人員：<span id="display-name" style="color: #1e40af; font-size: 1.1rem;"></span></span>
        <span id="answered-count">已作答：0 / 10 題</span>
      </div>

      <div id="questions-container">
        <!-- 10 Questions rendered by JS -->
      </div>

      <div class="quiz-actions" id="submit-action-area">
        <button class="btn btn-primary" onclick="submitQuiz()">送出答案並計分</button>
      </div>

      <!-- STEP 3: Score Summary (Hidden initially) -->
      <div id="result-summary" style="display: none;">
        <div class="score-card">
          <p id="result-user-greeting" style="font-weight: 600; font-size: 1.2rem; margin-bottom: 0.5rem;"></p>
          <h2 id="final-score">總分：0 分</h2>
          <p id="final-stats">答對 0 題 ‧ 答錯 0 題</p>
        </div>

        <div style="text-align: center; margin-bottom: 3rem;">
          <button class="btn btn-secondary" onclick="restartQuiz()">🔄 重新測驗</button>
        </div>
      </div>

    </div>

  </main>

  <footer>
    <p>公務人員行政中立線上測驗系統</p>
  </footer>

  <script>
    let userName = "";

    const questions = [
      {
        id: 1,
        question: "依據宣導資料，公務人員於執行職務及參與政治活動時，應嚴格遵循的行政中立「三不原則」不包含下列何者？",
        options: {
          A: "不利用上班時間",
          B: "不利用公家資源",
          C: "不利用職務關係",
          D: "不參與政黨組織"
        },
        answer: "D"
      },
      {
        id: 2,
        question: "下列哪一類人員「不適用」公務人員行政中立法，但銓敘部已將其規範列入政務人員法草案中，顧及社會觀感仍須配合遵循？",
        options: {
          A: "基隆市政府府本部秘書長與各區區長",
          B: "公立高級中學校長及兼任總務主任之教師",
          C: "民選之直轄市長、縣（市）長及政治性任命之政務人員",
          D: "公營捷運公司之總經理及董事長"
        },
        answer: "C"
      },
      {
        id: 3,
        question: "關於各機關學校之「技工、工友、臨時人員」以及「駐衛警察」之行政中立規範依據，下列敘述何者正確？",
        options: {
          A: "技工與工友直接適用《公務人員行政中立法》",
          B: "駐衛警察依《各機關學校團體駐衛警察設置管理辦法》規定，準用《公務人員行政中立法》",
          C: "臨時人員無須遵守任何行政中立規範",
          D: "駐衛警察與工友均僅遵守《勞動基準法》，不受行政中立約束"
        },
        answer: "B"
      },
      {
        id: 4,
        question: "依《公務人員行政中立法》第9條規定，公務人員原則上不得公開為公職候選人站台、助講、遊行或拜票，但下列何種情形屬於法規明定之「例外容許」？",
        options: {
          A: "該公職候選人為同黨籍好友，於非上班時間為之",
          B: "公職候選人為其配偶或二親等以內血親、姻親",
          C: "公職候選人為同鄉會理事長，並已辦理休假手續",
          D: "經機關首長口頭許可之特定公職候選人"
        },
        answer: "B"
      },
      {
        id: 5,
        question: "公務人員在公職選舉期間，若要在報紙、網路等大眾傳播媒體刊登支持候選人之廣告，下列何者符合規定？",
        options: {
          A: "只要請假即可具名且具銜刊登廣告",
          B: "公職候選人為其配偶或二親等內親屬時，得只具名不具銜廣告",
          C: "任何人只要自費刊登，皆可具銜廣告",
          D: "公職候選人為同校校友時，得只具銜不具名廣告"
        },
        answer: "B"
      },
      {
        id: 6,
        question: "關於公務人員參加政黨活動的限制，下列敘述何者「錯誤」？",
        options: {
          A: "公務人員得加入政黨，但不得兼任政黨職務",
          B: "公務人員不得兼任公職候選人競選辦事處之職務",
          C: "公務人員可以在上班時間於機關內部成立政黨黨團辦公室",
          D: "公務人員得於請假或非上班時間參加政黨活動"
        },
        answer: "C"
      },
      {
        id: 7,
        question: "公務人員經登記為公職候選人者，依《公務人員行政中立法》第11條規定，其請假義務為何？",
        options: {
          A: "自登記日起至投票日止，應全面辦理留職停薪",
          B: "自候選人名單公告之日起至投票日止，應依規定請事假或休假",
          C: "僅有投票當日需要請公假",
          D: "無須請假，只要不耽誤原本業務即可"
        },
        answer: "B"
      },
      {
        id: 8,
        question: "在選舉委員會發布選舉公告日至投票日止之選舉期間，機關辦公處所的管理措施何者正確？",
        options: {
          A: "應歡迎各黨派候選人依序至各辦公室拜票，以展現親民",
          B: "應禁止政黨、公職候選人或其支持者之造訪拜票活動，並應於各出入口明顯處張貼禁止競選活動之告示",
          C: "僅有在機關內部大禮堂才可以穿戴競選服飾拜票",
          D: "只需口頭告知警衛，無需張貼任何書面告示"
        },
        answer: "B"
      },
      {
        id: 9,
        question: "長官若要求公務人員從事違反行政中立之行為時，公務人員應如何應對與保障自身權益？",
        options: {
          A: "服從是公務員天職，長官命令一律不得拒絕",
          B: "長官不得要求公務人員為違反行政中立行為；若因拒絕而遭受不利處分，公務人員得向該長官之上級長官報告，未依法處理者得向監察院檢舉",
          C: "公務人員只能默默承受不利考績，無法提出任何救濟",
          D: "公務人員應立即至媒體爆料，不得循行政體系反映"
        },
        answer: "B"
      },
      {
        id: 10,
        question: "宣導手冊中的實務案例三（警察局長請假為直轄市長「擬參選人」拜票站台高喊凍蒜），警政署最終將其記申誡一次，其主要法理依據與考量為何？",
        options: {
          A: "因該對象為「擬參選人」且局長請假，故已構成違反行政中立法第9條之刑事責任",
          B: "該行為雖未直接違反行政中立法，但已損及警察行政中立形象與官箴，機關得依公務員獎懲標準以言行失檢懲處",
          C: "警察人員即便在非上班時間亦絕對不可參與任何宗教祈福活動",
          D: "局長因未先向中選會報備，故處以行政罰鍰"
        },
        answer: "B"
      }
    ];

    // Start Quiz
    function startQuiz() {
      const nameInput = document.getElementById('user-name');
      const val = nameInput.value.trim();
      const err = document.getElementById('name-error');

      if (!val) {
        err.style.display = 'block';
        nameInput.focus();
        return;
      }

      err.style.display = 'none';
      userName = val;
      document.getElementById('display-name').textContent = userName;

      document.getElementById('start-screen').style.display = 'none';
      document.getElementById('quiz-screen').style.display = 'block';

      renderQuestions();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Render 10 Questions (Only questions and options)
    function renderQuestions() {
      const container = document.getElementById('questions-container');
      container.innerHTML = '';

      questions.forEach((q, idx) => {
        const card = document.createElement('div');
        card.className = 'question-card';
        card.id = `q-${q.id}`;

        let opts = '';
        for (const [key, text] of Object.entries(q.options)) {
          opts += `
            <label class="option-item" id="opt-${q.id}-${key}">
              <input type="radio" name="question-${q.id}" value="${key}" onchange="updateCount()">
              <span><strong>(${key})</strong> ${text}</span>
            </label>
          `;
        }

        card.innerHTML = `
          <div class="q-header">
            <span class="q-badge">第 ${idx + 1} 題 / 共 10 題</span>
            <span class="q-status" id="status-${q.id}">未作答</span>
          </div>
          <div class="q-text">${q.question}</div>
          <div class="options-list">${opts}</div>
          <div class="result-status" id="result-${q.id}"></div>
        `;
        container.appendChild(card);
      });
    }

    function updateCount() {
      let answered = 0;
      questions.forEach(q => {
        const sel = document.querySelector(`input[name="question-${q.id}"]:checked`);
        const statusEl = document.getElementById(`status-${q.id}`);
        if (sel) {
          answered++;
          statusEl.textContent = `已選 (${sel.value})`;
          statusEl.style.color = '#059669';
        } else {
          statusEl.textContent = `未作答`;
          statusEl.style.color = '#64748b';
        }
      });
      document.getElementById('answered-count').textContent = `已作答：${answered} / 10 題`;
    }

    // Submit Quiz
    function submitQuiz() {
      let answered = 0;
      questions.forEach(q => {
        if (document.querySelector(`input[name="question-${q.id}"]:checked`)) answered++;
      });

      if (answered < 10) {
        if (!confirm(`您目前僅作答 ${answered} 題（尚有 ${10 - answered} 題未填），確定要送出答案嗎？`)) {
          return;
        }
      }

      let correctCount = 0;

      questions.forEach(q => {
        const selected = document.querySelector(`input[name="question-${q.id}"]:checked`);
        const resEl = document.getElementById(`result-${q.id}`);

        // Disable radio inputs after submit
        document.querySelectorAll(`input[name="question-${q.id}"]`).forEach(inp => inp.disabled = true);

        if (selected && selected.value === q.answer) {
          correctCount++;
          resEl.className = 'result-status result-correct';
          resEl.textContent = `✅ 答對！您選擇的答案是 (${selected.value})`;
        } else {
          resEl.className = 'result-status result-incorrect';
          const yourAns = selected ? selected.value : "未作答";
          resEl.textContent = `❌ 答錯！您的選擇為 (${yourAns})，正確答案為 (${q.answer})`;
        }
      });

      // Show summary score
      const score = correctCount * 10;
      document.getElementById('result-user-greeting').textContent = `${userName} 同仁，您的測驗成績已結算：`;
      document.getElementById('final-score').textContent = `總分：${score} 分`;
      document.getElementById('final-stats').textContent = `答對 ${correctCount} 題 ‧ 答錯 ${10 - correctCount} 題`;

      document.getElementById('submit-action-area').style.display = 'none';
      document.getElementById('result-summary').style.display = 'block';

      document.getElementById('result-summary').scrollIntoView({ behavior: 'smooth' });
    }

    // Restart
    function restartQuiz() {
      document.getElementById('quiz-screen').style.display = 'none';
      document.getElementById('result-summary').style.display = 'none';
      document.getElementById('submit-action-area').style.display = 'flex';
      document.getElementById('start-screen').style.display = 'block';
      document.getElementById('user-name').value = '';
      document.getElementById('name-error').style.display = 'none';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Press enter on name input to start
    document.getElementById('user-name').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        startQuiz();
      }
    });
  </script>
</body>
</html>
